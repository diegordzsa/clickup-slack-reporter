name: Weekly Report

on:
  schedule:
    # Lunes 6:00 UTC = 8:00 AM Espana (verano CEST) / 7:00 AM (invierno CET)
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Permite correr manualmente desde GitHub

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  generate-weekly-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para commitear el log limpiado

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly report
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          CLICKUP_TEAM_ID: ${{ secrets.CLICKUP_TEAM_ID }}
          CLICKUP_FOLDER_ID_HAIRBIOLABS: ${{ secrets.CLICKUP_FOLDER_ID_HAIRBIOLABS }}
          CLICKUP_FOLDER_ID_HAIRBIOLABS_MX: ${{ secrets.CLICKUP_FOLDER_ID_HAIRBIOLABS_MX }}
          CLICKUP_FOLDER_ID_LYSSODERMA: ${{ secrets.CLICKUP_FOLDER_ID_LYSSODERMA }}
          CLICKUP_FOLDER_ID_LYSSODERMA_EN: ${{ secrets.CLICKUP_FOLDER_ID_LYSSODERMA_EN }}
          CLICKUP_FOLDER_ID_ESPANA: ${{ secrets.CLICKUP_FOLDER_ID_ESPANA }}
          CLICKUP_FOLDER_ID_ZENDI: ${{ secrets.CLICKUP_FOLDER_ID_ZENDI }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python weekly_report.py

      - name: Commit transitions log (post-cleanup)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ ! -f data/transitions_log.jsonl ]; then
            echo "transitions_log.jsonl does not exist yet, nothing to commit."
            exit 0
          fi
          git add data/transitions_log.jsonl
          git diff --staged --quiet && echo "Sin cambios que commitear" && exit 0
          git commit -m "Weekly cleanup transitions_log $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git push; then
              echo "Push OK"
              exit 0
            fi
            echo "Push fallo (intento $i). Rebaseando sobre origin/main..."
            git pull --rebase origin main || exit 1
            sleep 5
          done
          echo "No se pudo pushear tras 3 intentos"
          exit 1

      - name: Alertar a Slack si algo fallo
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "Sin SLACK_WEBHOOK_URL: no se puede alertar"
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: *Weekly Report FALLO* — $(date -u +%Y-%m-%d\ %H:%M) UTC\nEl reporte semanal no se envio.\n<${RUN_URL}|Ver el error>\"}" \
            "$SLACK_WEBHOOK_URL"
